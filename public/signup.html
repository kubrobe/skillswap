<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up - SkillSwap</title>
  <meta name="theme-color" content="#f4f5fb">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="SkillSwap home"><span class="brand-dot" aria-hidden="true"></span><span>SkillSwap</span></a>
  </header>
  <main id="main" class="auth">
    <h1 class="page-title">Create your account</h1>
    <p class="page-sub">Join to offer skills and learn new ones.</p>
    <div id="msg" class="notice error hidden" role="alert"></div>
    <form id="form" novalidate>
      <div class="field"><label for="display_name">Your name</label><input id="display_name" name="display_name" autocomplete="name" required minlength="2" maxlength="60"></div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" inputmode="email" required></div>
      <div class="field"><label for="password">Password <span class="hint">(at least 8 characters)</span></label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="72"></div>
      <button class="btn btn-primary btn-block" type="submit">Create your account</button>
    </form>
    <p class="auth-foot">Already a member? <a href="/login">Log in</a></p>
  </main>
  <script type="module" src="/js/signup.js"></script>
</body>
</html>
