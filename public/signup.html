<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign up - SkillSwap</title>
  <meta name="theme-color" content="#0e1014">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="auth-page">
    <aside class="auth-side" aria-hidden="true">
      <a class="brand" href="/" aria-label="SkillSwap home"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#1B1D23"/><path d="M32 12v11a9 9 0 0 1-9 9H9z" fill="#E0B44C" fill-opacity=".25"/><path d="M8 12.5h14l-3.5-3.5M24 19.5H10l3.5 3.5" fill="none" stroke="#E0B44C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>SkillSwap</span></a>
      <div class="quote">
        <h2>Everyone is good at something.</h2>
        <p>Teach it for an hour, earn a credit, and learn anything you like with it. Five welcome credits to start.</p>
        <div class="mini" id="mini">
          <div><b data-count="members">–</b><span>members</span></div>
          <div><b data-count="lessonsDone">–</b><span>lessons finished</span></div>
          <div><b data-count="avgRating" data-decimals="1">–</b><span>average rating</span></div>
        </div>
      </div>
    </aside>
    <main id="main" class="auth-main">
      <a class="brand" href="/" aria-label="SkillSwap home"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#1B1D23"/><path d="M32 12v11a9 9 0 0 1-9 9H9z" fill="#E0B44C" fill-opacity=".25"/><path d="M8 12.5h14l-3.5-3.5M24 19.5H10l3.5 3.5" fill="none" stroke="#E0B44C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>SkillSwap</span></a>
      <span class="theme-float" data-theme-slot></span>
      <div class="auth">
        <h1 class="page-title">Create your account</h1>
        <p class="page-sub">Join free. It takes a minute.</p>
        <div id="msg" class="notice error hidden" role="alert"></div>
        <form id="form" novalidate>
          <div class="field"><label for="display_name">Your name</label><input id="display_name" name="display_name" autocomplete="name" required minlength="2" maxlength="60"></div>
          <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" inputmode="email" required></div>
          <div class="field"><label for="password">Password <span class="hint">(at least 8 characters)</span></label><div class="pw-wrap"><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="72"></div></div>
          <button class="btn btn-primary btn-block btn-large" type="submit">Create your account</button>
        </form>
        <p class="auth-foot">Already a member? <a href="/login">Log in</a></p>
        
      </div>
    </main>
  </div>
  <script type="module" src="/js/signup.js"></script>
</body>
</html>
